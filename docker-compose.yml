version: '3.8'

services:
  # --- バックエンドサービス ---
  backend:
    build: ./backend
    container_name: gc_backend
    ports:
      - "8000:8000"
    volumes:
      # コードをコンテナにマウントすることで、修正後に再ビルドせずホットリロード可能
      - ./backend:/app
      # コンテナ停止時にデータが消えないよう、DBファイルをボリュームとして外部にマッピング
      - ./backend_data:/app/data 
    environment:
      - DATABASE_URL=sqlite:///./data/database.db

  # --- フロントエンドサービス ---
  frontend:
    build: ./frontend
    container_name: gc_frontend
    ports:
      - "5173:5173"
    volumes:
      # コードをマウントし、画面修正を即時反映（ホットリロード）
      - ./frontend:/app
      # 環境差異による問題を避けるため、ホストの node_modules をコンテナへマッピングしない
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend